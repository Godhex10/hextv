name = "streamtogether-rooms"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

# SQLite-backed Durable Objects are the kind available on the Workers Free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]

# Health checks and alert rules
[triggers]
crons = ["*/15 * * * *"]

[vars]
API_BASE = "https://streamtogether-pi.vercel.app"
# SHA-256 of the dashboard password (the password itself is in dashboard-password.txt, not in git)
DASHBOARD_PASSWORD_SHA256 = "737cf29528ecfdbb706ae76b84cdf35263c3241f1a86315ae83f9059587fe1cf"
# Telegram alerts: set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID with `npx wrangler secret put`

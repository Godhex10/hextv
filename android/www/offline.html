<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HexTV — offline</title>
<style>
  html, body { margin: 0; height: 100%; background: #050507; color: #f6f6f8; font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
  body { display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .mark { width: 56px; height: 56px; margin: 0 auto 20px; opacity: .55; } .mark svg { width: 100%; height: 100%; display: block; }
  h1 { font-size: 21px; margin: 0 0 8px; } p { color: #9a9aa8; font-size: 14px; margin: 0 0 22px; line-height: 1.5; }
  button { background: linear-gradient(135deg, #ff2d3a, #e50914 45%, #b20710); color: #fff; border: 0; border-radius: 12px; padding: 13px 26px;
    font: 600 15px system-ui, sans-serif; box-shadow: 0 8px 24px -8px rgba(229,9,20,.8); }
</style></head>
<body><div>
  <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 80 80"><defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3a46"/><stop offset=".5" stop-color="#e50914"/><stop offset="1" stop-color="#a5060f"/></linearGradient></defs><path d="M16,12h20a4,4 0 0 1 4,4v24h20v-24a4,4 0 0 1 4,-4h20a4,4 0 0 1 4,4v68a4,4 0 0 1 -4,4h-20a4,4 0 0 1 -4,-4v-24h-20v24a4,4 0 0 1 -4,4h-20a4,4 0 0 1 -4,-4v-68a4,4 0 0 1 4,-4z" fill="url(#r)"/></svg></div>
  <h1>Can't reach HexTV</h1>
  <p>Check your internet connection, then try again.<br>HexTV will reconnect by itself when you're back online.</p>
  <button id="retry">Try again</button>
</div>
<script>
  const go = () => { location.href = 'https://streamtogether-pi.vercel.app/app-start.html'; };
  document.getElementById('retry').onclick = go;
  addEventListener('online', go);
  // No connection: don't keep Android's launch screen up waiting for the site
  try { Capacitor.Plugins.SplashScreen.hide(); } catch (e) { /* not in the app */ }
</script></body></html>

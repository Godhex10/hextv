<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>HexTV</title>
<style>
  html, body { margin: 0; height: 100%; background: #050507; overflow: hidden; }
  body { display: grid; place-items: center; font-family: "Segoe UI", system-ui, sans-serif; }
  .glow { position: fixed; width: 900px; height: 900px; left: 50%; top: 50%; margin: -450px; border-radius: 50%;
    background: radial-gradient(circle, rgba(229,9,20,.22), transparent 60%); animation: breathe 2.4s ease-in-out infinite; }
  .mark { position: relative; width: 84px; height: 84px; margin: 0 auto; filter: drop-shadow(0 16px 36px rgba(229,9,20,.75));
    animation: beat 1.2s ease-in-out infinite; }
  .mark svg { display: block; width: 100%; height: 100%; }
  .name { position: relative; margin-top: 22px; text-align: center; font-weight: 800; font-size: 26px; letter-spacing: .14em; color: #e50914; }
  .name span { color: #fff; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes breathe { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <div class="glow"></div>
  <div><div class="mark"><svg viewBox="10 10 80 80"><defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3a46"/><stop offset=".5" stop-color="#e50914"/><stop offset="1" stop-color="#a5060f"/></linearGradient></defs><path d="M16,12h20a4,4 0 0 1 4,4v24h20v-24a4,4 0 0 1 4,-4h20a4,4 0 0 1 4,4v68a4,4 0 0 1 -4,4h-20a4,4 0 0 1 -4,-4v-24h-20v24a4,4 0 0 1 -4,4h-20a4,4 0 0 1 -4,-4v-68a4,4 0 0 1 4,-4z" fill="url(#r)"/></svg></div><div class="name">HEX<span>TV</span></div></div>
</body>
</html>

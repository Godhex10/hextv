<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>HexTV — offline</title>
<style>
  html, body { margin: 0; height: 100%; background: #050507; color: #f6f6f8; font-family: "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .mark { width: 54px; height: 54px; margin: 0 auto 20px; opacity: .55; }
  .mark svg { display: block; width: 100%; height: 100%; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #9a9aa8; font-size: 14px; margin: 0 0 22px; }
  button { background: linear-gradient(135deg, #ff2d3a, #e50914 45%, #b20710); color: #fff; border: 0; border-radius: 10px; padding: 11px 22px;
    font: 600 14px "Segoe UI", sans-serif; cursor: pointer; box-shadow: 0 8px 24px -8px rgba(229,9,20,.8); }
  button:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <div>
    <div class="mark"><svg viewBox="10 10 80 80"><defs><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3a46"/><stop offset=".5" stop-color="#e50914"/><stop offset="1" stop-color="#a5060f"/></linearGradient></defs><path d="M16,12h20a4,4 0 0 1 4,4v24h20v-24a4,4 0 0 1 4,-4h20a4,4 0 0 1 4,4v68a4,4 0 0 1 -4,4h-20a4,4 0 0 1 -4,-4v-24h-20v24a4,4 0 0 1 -4,4h-20a4,4 0 0 1 -4,-4v-68a4,4 0 0 1 4,-4z" fill="url(#r)"/></svg></div>
    <h1>Can't reach HexTV</h1>
    <p>Check your internet connection, then try again.</p>
    <button id="retry">Try again</button>
  </div>
  <script>
    // Retry the page that failed (only HexTV addresses), or the library
    const SITE = 'https://streamtogether-pi.vercel.app/';
    const u = new URLSearchParams(location.search).get('u') || '';
    const target = u.startsWith(SITE) ? u : SITE + 'library.html';
    document.getElementById('retry').onclick = () => { location.href = target; };
    window.addEventListener('online', () => { location.href = target; });
  </script>
</body>
</html>
